project:
  type: book
  output-dir: docs
  resources:
    - .nojekyll
    - images/author/Jesen.png

book:
  title: "PRAKTIKUM PENGANTAR STATISTIKA"
  author: "Jesen"
  date: today
  description: "Buku praktikum pengantar statistika yang memuat kumpulan materi dan penggunaan data menggunakan R, mulai dari statistika deskriptif hingga dasar-dasar inferensi."
  repo-url: https://github.com/sennie17/STATISITKA-EBOOK.git
  repo-actions: [edit, issue]
  downloads: [pdf]
  chapters:
    - index.qmd
    - chapters/bab-1.qmd
    - chapters/bab-2.qmd
    - chapters/bab-3.qmd
    - chapters/bab-4.qmd
    - chapters/bab-5.qmd
    - chapters/bab-9.qmd
    - chapters/bab-10.qmd
    - references/referensi.qmd

bibliography:
  - references/book.bib
  - references/packages.bib
csl: references/ieee.csl
link-citations: true

format:
  html:
    theme: cosmo
    css: assets/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-fold: false
    smooth-scroll: true
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="author" content="Jesen">
  pdf:
    documentclass: book
    pdf-engine: xelatex
    keep-tex: true
    include-in-header: assets/preamble.tex
    number-sections: true
    toc: true
  epub:
    cover-image: images/Cover1.png

execute:
  freeze: auto
  echo: true
  warning: false
  message: false

lang: id
language:
  search-text-placeholder: "Cari di buku…"
